name: ci

on: [push, pull_request]

jobs:
  test:
    uses: catalyst/catalyst-moodle-workflows/.github/workflows/ci.yml@main
    secrets:
      # Required to publish to the plugins directory, which disable_release below turns off.
      moodle_org_token: ${{ secrets.MOODLE_ORG_TOKEN }}
    with:
      # The code uses the nullsafe operator, so it does not parse on 7.4, and 8.0 is out of support.
      min_php: '8.1'
      disable_release: true
